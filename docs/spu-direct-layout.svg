<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="2" fill="#b8c2cc"/></pattern></defs>
<style>
text{font-family:Arial,'Hiragino Sans',sans-serif;fill:#17212b;font-size:17px}.title{font-size:28px;font-weight:bold}.sub{font-size:21px;font-weight:bold}.small{font-size:14px}.warn{fill:#a64000}
